<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento de Clientes</title>
    <!-- Bootstrap CSS para um design moderno e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary"><i class="fa-solid fa-calendar-days me-2"></i>Agendamento de Clientes</h1>
            <p class="text-muted">Gerencie seus horários e atendimento de forma simples e rápida</p>
        </header>

        <div class="row g-4">
            <!-- Formulário de Cadastro -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0"><i class="fa-solid fa-user-plus me-2"></i>Novo Agendamento</h5>
                    </div>
                    <div class="card-body">
                        <form id="formAgendamento">
                            <div class="mb-3">
                                <label for="nomeCliente" class="form-label">Nome do Cliente</label>
                                <input type="text" class="form-control" id="nomeCliente" required placeholder="Ex: Maria Silva">
                            </div>
                            <div class="mb-3">
                                <label for="servico" class="form-label">Serviço / Atendimento</label>
                                <input type="text" class="form-control" id="servico" required placeholder="Ex: Consulta, Manutenção, Corte...">
                            </div>
                            <div class="mb-3">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" class="form-control" id="data" required>
                            </div>
                            <div class="mb-3">
                                <label for="horario" class="form-label">Horário</label>
                                <input type="time" class="form-control" id="horario" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefone" class="form-label">WhatsApp / Telefone</label>
                                <input type="text" class="form-control" id="telefone" placeholder="Ex: 81999998888">
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-check me-2"></i>Salvar Agendamento</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listagem e Filtros -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="card-title mb-0 text-secondary"><i class="fa-solid fa-list me-2"></i>Lista de Agendamentos</h5>
                        <div class="d-flex gap-2">
                            <input type="date" id="filtroData" class="form-control form-control-sm" placeholder="Filtrar por data">
                            <button class="btn btn-outline-secondary btn-sm" onclick="limparFiltro()">Limpar</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Cliente</th>
                                        <th>Serviço</th>
                                        <th>Data/Hora</th>
                                        <th>Status</th>
                                        <th class="text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaAgendamentos">
                                    <!-- Os dados inseridos aparecerão aqui dinamicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Funcionamento -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarAgendamentos();

            document.getElementById('formAgendamento').addEventListener('submit', function(e) {
                e.preventDefault();
                salvarAgendamento();
            });

            document.getElementById('filtroData').addEventListener('change', function() {
                carregarAgendamentos(this.value);
            });
        });

        function obterAgendamentos() {
            return JSON.parse(localStorage.getItem('agendamentos')) || [];
        }

        function salvarAgendamento() {
            const nome = document.getElementById('nomeCliente').value;
            const servico = document.getElementById('servico').value;
            const data = document.getElementById('data').value;
            const horario = document.getElementById('horario').value;
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');

            const novoAgendamento = {
                id: Date.now(),
                nome,
                servico,
                data,
                horario,
                telefone,
                status: 'Pendente'
            };

            const agendamentos = obterAgendamentos();
            agendamentos.push(novoAgendamento);
            localStorage.setItem('agendamentos', JSON.stringify(agendamentos));

            document.getElementById('formAgendamento').reset();
            carregarAgendamentos();
        }

        function carregarAgendamentos(filtro = '') {
            const tbody = document.getElementById('tabelaAgendamentos');
            tbody.innerHTML = '';

            let agendamentos = obterAgendamentos();

            if (filtro) {
                agendamentos = agendamentos.filter(a => a.data === filtro);
            }

            // Ordenar por data e horário
            agendamentos.sort((a, b) => new Date(`${a.data}T${a.horario}`) - new Date(`${b.data}T${b.horario}`));

            if (agendamentos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Nenhum agendamento encontrado.</td></tr>`;
                return;
            }

            agendamentos.forEach(a => {
                const [ano, mes, dia] = a.data.split('-');
                const dataFormatada = `${dia}/${mes}/${ano}`;

                let badgeStatus = 'bg-warning text-dark';
                if (a.status === 'Concluído') badgeStatus = 'bg-success';
                if (a.status === 'Cancelado') badgeStatus = 'bg-danger';

                let acaoWhatsApp = a.telefone ? `<a href="https://wa.me/55${a.telefone}?text=Olá%20${encodeURIComponent(a.nome)},%20passando%20para%20confirmar%20seu%20agendamento%20de%20${encodeURIComponent(a.servico)}%20para%20o%20dia%20${dataFormatada}%20às%20${a.horario}." target="_blank" class="btn btn-sm btn-success" title="Enviar WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>` : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${a.nome}</strong></td>
                    <td>${a.servico}</td>
                    <td>${dataFormatada} às ${a.horario}</td>
                    <td><span class="badge ${badgeStatus}" style="cursor:pointer;" onclick="alternarStatus(${a.id})" title="Clique para alterar status">${a.status}</span></td>
                    <td class="text-center">
                        <div class="btn-group" role="group">
                            ${acaoWhatsApp}
                            <button class="btn btn-sm btn-outline-danger" onclick="excluirAgendamento(${a.id})" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function alternarStatus(id) {
            let agendamentos = obterAgendamentos();
            agendamentos = agendamentos.map(a => {
                if (a.id === id) {
                    if (a.status === 'Pendente') a.status = 'Concluído';
                    else if (a.status === 'Concluído') a.status = 'Cancelado';
                    else a.status = 'Pendente';
                }
                return a;
            });
            localStorage.setItem('agendamentos', JSON.stringify(agendamentos));
            carregarAgendamentos(document.getElementById('filtroData').value);
        }

        function excluirAgendamento(id) {
            if (confirm('Deseja realmente excluir este agendamento?')) {
                let agendamentos = obterAgendamentos();
                agendamentos = agendamentos.filter(a => a.id !== id);
                localStorage.setItem('agendamentos', JSON.stringify(agendamentos));
                carregarAgendamentos(document.getElementById('filtroData').value);
            }
        }

        function limparFiltro() {
            document.getElementById('filtroData').value = '';
            carregarAgendamentos();
        }
    </script>
</body>
</html>
